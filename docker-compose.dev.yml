name: plutus-dev

services:
  dotnet:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    working_dir: /workspace
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Development
      NUGET_PACKAGES: /root/.nuget/packages
    volumes:
      # Mount only build inputs; never mount the project-root .env secret file.
      - ./Plutus.slnx:/workspace/Plutus.slnx
      - ./src:/workspace/src
      - ./tests:/workspace/tests
      - plutus-nuget:/root/.nuget/packages
    ports:
      - "127.0.0.1:8080:8080"
    command: dotnet test Plutus.slnx

volumes:
  plutus-nuget:
